name: proyecto_api
services:
  api:
    build: .
    image: grupo1-api:1.0
    container_name: proyecto-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - proyecto_red
networks:
  proyecto_red:
    external: true
    name: proyecto-red
