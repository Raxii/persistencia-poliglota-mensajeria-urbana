name: proyecto_frontend
services:
  web:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    image: grupo1-frontend:1.0
    container_name: proyecto-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - proyecto_red
networks:
  proyecto_red:
    external: true
    name: proyecto-red
